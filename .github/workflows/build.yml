name: Build launcher APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build the app
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PriyanshuLauncher.apk

      - name: Keep APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PriyanshuLauncher
          path: PriyanshuLauncher.apk

      - name: Publish to the "latest" release (easy phone download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest PriyanshuLauncher.apk --title "Priyanshu Launcher build ${{ github.run_number }}" --notes "Automatic build. Download PriyanshuLauncher.apk on your phone and install it."
